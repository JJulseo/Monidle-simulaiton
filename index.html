<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>바이오마커 확산 — 튜닝 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#060912; --ink:#e8edf7; --muted:#8a93ac; --gfap:#43dcec; --uch:#f6b13e; --gold:#f0cf7e;
    --line:rgba(255,255,255,.10); --glass:rgba(12,17,30,.66); }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1100px 700px at 72% -10%, #10172b 0%, transparent 60%), var(--bg);
    color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;align-items:flex-start;min-height:100%;overflow-y:auto}
  .app{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:560px;margin:auto;padding:clamp(12px,3vw,22px)}
  header{text-align:center}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:600;line-height:1.05;font-size:clamp(20px,5vw,28px);letter-spacing:-.01em}
  h1 .a{color:var(--muted);font-weight:400;margin:0 .1em}
  .stage{position:relative;height:min(58vh,500px);aspect-ratio:4/5;max-width:100%;border-radius:15px;overflow:hidden;
    background:#04060d;border:1px solid var(--line);box-shadow:0 32px 80px -34px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,255,255,.02)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .tag{position:absolute;right:10px;text-align:right;font-family:"JetBrains Mono",monospace;text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .tag .n{font-size:10px;color:var(--ink);letter-spacing:.16em;opacity:.92}.tag .t{font-size:11px;color:var(--muted);margin-top:1px}
  .t-sensor{top:9px}.t-isf{top:46%}.t-vessel{bottom:8px}
  .elabel{position:absolute;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;transform:translateX(-50%);text-shadow:0 1px 8px rgba(0,0,0,.95)}
  .e-gfap{left:33%;top:5px;color:var(--gfap)}.e-uch{left:65%;top:5px;color:var(--uch)}
  .controls{width:100%;display:flex;flex-direction:column;gap:9px}
  .crow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 13px;border-radius:12px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  button{font-family:"Space Grotesk",sans-serif;font-size:12.5px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;transition:.16s}
  button:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
  button:active{transform:translateY(1px)}button.off{opacity:.4}
  button:focus-visible{outline:2px solid var(--gfap);outline-offset:2px}
  .onset{display:flex;flex-direction:column;gap:7px;padding:11px 15px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}
  .onset .top{display:flex;justify-content:space-between;align-items:baseline}
  .onset .lbl{font-family:"Space Grotesk",sans-serif;font-size:13px;font-weight:600}
  .onset .lbl small{font-family:"JetBrains Mono",monospace;font-weight:400;color:var(--muted);font-size:10px;margin-left:6px}
  .onset .phase{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gfap)}
  .panel{padding:6px 13px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}
  .panel>summary{cursor:pointer;font-family:"Space Grotesk",sans-serif;font-size:13px;font-weight:600;padding:7px 2px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .panel>summary::-webkit-details-marker{display:none}
  .panel>summary::after{content:'▾';color:var(--muted);font-size:11px}
  .panel[open]>summary::after{content:'▴'}
  .grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:6px}
  .par{display:flex;align-items:center;gap:10px}
  .par label{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;width:88px;flex:none}
  .par output{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink);width:38px;text-align:right;flex:none}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.16);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gfap);cursor:pointer;box-shadow:0 0 9px rgba(67,220,236,.55)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--gfap);cursor:pointer}
  #onsetR{height:4px;background:linear-gradient(90deg,#2a3350,#f6b13e 55%,#43dcec);pointer-events:none;cursor:default}
  #onsetR::-webkit-slider-thumb{width:10px;height:10px;background:#fff;opacity:.7}
  .onset-speed{display:flex;align-items:center;gap:10px;margin-top:2px}
  .onset-speed label{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;width:88px;flex:none}
  .onset-speed output{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink);width:52px;text-align:right;flex:none}
  .onset-speed input[type=range]{flex:1;height:3px}
  .toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .hint{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Interstitial Aptamer Biosensor · 튜닝 콘솔</div>
    <h1>혈관<span class="a">↑</span>간질액<span class="a">↑</span>센서</h1>
  </header>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <svg class="ov" viewBox="0 0 100 125" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#b8923c"/><stop offset=".5" stop-color="#f6dd97"/><stop offset="1" stop-color="#a9842f"/></linearGradient></defs>
      <rect x="0" y="0" width="100" height="3.6" fill="#cfd6e0" opacity=".82"/>
      <rect x="0" y="3.6" width="100" height="4.6" fill="#f0c4a6" opacity=".82"/>
      <rect x="0" y="8.2" width="100" height="7.6" fill="#e29a96" opacity=".7"/>
      <rect x="25.5" y="1" width="16" height="2.4" rx="1" fill="url(#gold)"/>
      <rect x="57.5" y="1" width="16" height="2.4" rx="1" fill="url(#gold)"/>
      <g id="needles"></g><g id="aptamers"></g>
      <line id="wallLine" x1="0" y1="106" x2="100" y2="106" stroke="#e5384f" stroke-width=".6" stroke-opacity=".5" stroke-dasharray="3 1.5"/>
      <g id="rbc" fill="#9a1f2b" opacity=".78"></g>
    </svg>
    <div class="ov">
      <div class="tag t-sensor"><div class="n">03 · 센서</div><div class="t">압타머 포획</div></div>
      <div class="tag t-isf"><div class="n">02 · 간질액</div><div class="t">확산 + 미세대류</div></div>
      <div class="tag t-vessel"><div class="n">01 · 혈관</div><div class="t">혈류 → 벽 누출</div></div>
      <div class="elabel e-gfap">GFAP</div><div class="elabel e-uch">UCH-L1</div>
    </div>
  </div>
  <div class="controls">
    <div class="onset">
      <div class="top"><span class="lbl">뇌졸중 진행도 <small>STROKE ONSET</small></span><span class="phase" id="phase">정상 (Baseline)</span></div>
      <input id="onsetR" type="range" min="0" max="100" value="0" tabindex="-1">
      <div class="onset-speed">
        <label>방출 속도</label>
        <input id="speedR" type="range" min="5" max="100" value="20">
        <output id="o_speed"></output>
      </div>
    </div>
    <div class="crow">
      <button id="play">⏸ 일시정지</button><button id="reset">↺ 리셋</button>
      <button id="tUch">UCH-L1</button><button id="tGfap">GFAP</button>
      <button id="tHole">구멍</button><button id="dbg">디버그</button>
      <button id="tColor">색상: 브랜드</button>
      <button id="tCurlMode">흐름: 복합</button>
    </div>

    <details class="panel" open>
      <summary>물리 파라미터</summary>
      <div class="grid">
        <div class="par"><label>혈류 속도</label><input id="p_flow" type="range" min="0" max="150" value="50"><output id="o_flow"></output></div>
        <div class="par"><label>누출 강도</label><input id="p_leak" type="range" min="5" max="100" value="30"><output id="o_leak"></output></div>
        <div class="par"><label>확산 D</label><input id="p_D" type="range" min="3" max="124" value="120"><output id="o_D"></output></div>
        <div class="par"><label>확산 반복</label><input id="p_iter" type="range" min="6" max="150" value="90"><output id="o_iter"></output></div>
        <div class="par"><label>clearance</label><input id="p_clr" type="range" min="900" max="1000" value="999"><output id="o_clr"></output></div>
        <div class="par"><label>curl 세기</label><input id="p_curl" type="range" min="0" max="60" value="25"><output id="o_curl"></output></div>
        <div class="par"><label>curl 진화</label><input id="p_curlT" type="range" min="0" max="60" value="12"><output id="o_curlT"></output></div>
      </div>
    </details>

    <details class="panel">
      <summary>렌더 / 색</summary>
      <div class="grid">
        <div class="par"><label>GFAP 색조</label><input id="p_hueG" type="range" min="0" max="360" value="190"><output id="o_hueG"></output></div>
        <div class="par"><label>UCH 색조</label><input id="p_hueU" type="range" min="0" max="360" value="35"><output id="o_hueU"></output></div>
        <div class="par"><label>블룸</label><input id="p_bloom" type="range" min="0" max="120" value="50"><output id="o_bloom"></output></div>
        <div class="par"><label>질감(워프)</label><input id="p_warp" type="range" min="0" max="60" value="16"><output id="o_warp"></output></div>
        <div class="par"><label>톤매핑</label><input id="p_tone" type="range" min="60" max="240" value="135"><output id="o_tone"></output></div>
      </div>
    </details>
    <div class="hint">curl 0 = 순수 확산(균일·정직) · curl↑ 시 진화도 같이↑ 하면 빈 띠 완화 · 마음에 드는 조합 찾으면 값 알려줘, 그걸로 고정할게</div>
  </div>
</div>

<script>
"use strict";
(function(){
  const canvas=document.getElementById('gl');
  const gl=canvas.getContext('webgl2',{antialias:false,premultipliedAlpha:false});
  if(!gl){document.getElementById('stage').innerHTML='<div style="color:#e8edf7;font-family:monospace;padding:30px;text-align:center">WebGL2 미지원.</div>';return;}
  gl.getExtension('EXT_color_buffer_float');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const FIELDS=`
  float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
    float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
    return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
  float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.02+vec2(1.7,9.2);a*=0.5;} return s; }
  vec2 curl(vec2 p){ float e=0.09;
    float a=fbm(p+vec2(0.0,e)),b=fbm(p-vec2(0.0,e)),c=fbm(p+vec2(e,0.0)),d=fbm(p-vec2(e,0.0));
    return vec2(a-b, d-c)/(2.0*e); }
  const vec2 LX=vec2(0.29,0.37); const vec2 RX=vec2(0.61,0.69);
  float nearShaft(float x,vec2 xs){ float dd=min(abs(x-xs.x),abs(x-xs.y)); return smoothstep(0.022,0.008,dd); }
  float leakGate(float x){ return max(smoothstep(0.060,0.026,abs(x-0.34)), smoothstep(0.060,0.026,abs(x-0.66))); }
  // uHole: 0 = uniform wall, 1 = discrete holes
  float Dmap(vec2 p, float D, float holes){
    float wall=smoothstep(0.150,0.158,p.y)*smoothstep(0.176,0.166,p.y);
    float perm=mix(0.30, leakGate(p.x), holes);     // holes? gated : uniform-ish
    float block=wall*(1.0-perm);
    return mix(D, 0.004, block);
  }`;

  const VERT=`#version 300 es
  in vec2 aPos; out vec2 vUv; void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}`;

  const ADVECT=`#version 300 es
  precision highp float; precision highp sampler2D;
  in vec2 vUv; out vec4 outColor; uniform sampler2D uField;
  uniform float uTime,uDt,uVel,uCurl,uCurlT,uLeak,uClr; uniform vec2 uBlood;
  uniform int uCurlMode;
  ${FIELDS}
  // Domain-warped curl: bends coordinates through a layer of fBm before computing curl.
  // Much more organic than straight curl — vortices fold and twist on themselves.
  vec2 curl_warp(vec2 p){
    float e=0.09;
    vec2 q=p+vec2(fbm(p),fbm(p+vec2(5.2,1.3)))*0.7;
    float a=fbm(q+vec2(0.0,e)),b=fbm(q-vec2(0.0,e)),
          c=fbm(q+vec2(e,0.0)),d=fbm(q-vec2(e,0.0));
    return vec2(a-b,d-c)/(2.0*e);
  }
  vec2 vel(vec2 p){
    if(p.y<0.155){ float b=(p.y-0.085)/0.06; float prof=max(0.0,1.0-b*b);
      float pulse=0.82+0.18*sin(uTime*2.1-p.x*18.85); return vec2(uVel*prof*pulse,0.0); }
    // sinusoidal time modulation: drift speed varies → vortices speed up and slow down
    float tx=uTime*uCurlT+sin(uTime*0.28)*0.55;
    float ty=uTime*uCurlT*1.15+cos(uTime*0.37+1.3)*0.45;
    if(uCurlMode==1){ return curl_warp(p*3.4+vec2(tx,ty))*uCurl; }
    // mode 0: two-scale interference — large slow vortices + small fast ones
    vec2 v1=curl(p*3.4+vec2(tx,ty));
    vec2 v2=curl(p*7.1+vec2(uTime*uCurlT*2.31,uTime*uCurlT*0.73))*0.38;
    return (v1+v2)*uCurl;
  }
  void main(){ vec2 p=vUv;
    vec2 src=p - vel(p)*uDt; src.x=fract(src.x);
    vec2 c=texture(uField, src).rg;
    if(p.y<0.13){ float k=smoothstep(0.13,0.03,p.y); c+=k*uLeak*max(vec2(0.0),uBlood-c); }
    float bloodTot=uBlood.r+uBlood.g;
    if(p.y>0.13){ c*=(1.0-smoothstep(0.10,0.0,bloodTot)*0.012); }
    if(p.y>0.16){ c*=uClr; }
    if(p.y>0.42&&p.y<0.875){ c.r*=(1.0-0.25*nearShaft(p.x,LX)*uDt*8.0); c.g*=(1.0-0.25*nearShaft(p.x,RX)*uDt*8.0); }
    if(p.y>0.86){ c*=0.6; }
    outColor=vec4(clamp(c,0.0,1.4),0.0,1.0);
  }`;

  const DIFFUSE=`#version 300 es
  precision highp float; precision highp sampler2D;
  in vec2 vUv; out vec4 outColor; uniform sampler2D uField; uniform vec2 uTexel,uBlood; uniform float uD,uLeak,uHole;
  ${FIELDS}
  vec2 samp(vec2 q){ q.x=fract(q.x); return texture(uField,q).rg; }
  void main(){ vec2 p=vUv;
    vec2 c=samp(p), cl=samp(p+vec2(-uTexel.x,0.0)), cr=samp(p+vec2(uTexel.x,0.0)),
         cu=samp(p+vec2(0.0,uTexel.y)), cd=samp(p+vec2(0.0,-uTexel.y));
    float Dc=Dmap(p,uD,uHole);
    float DL=0.5*(Dc+Dmap(p+vec2(-uTexel.x,0.0),uD,uHole)), DR=0.5*(Dc+Dmap(p+vec2(uTexel.x,0.0),uD,uHole));
    float DU=0.5*(Dc+Dmap(p+vec2(0.0,uTexel.y),uD,uHole)), DD=0.5*(Dc+Dmap(p+vec2(0.0,-uTexel.y),uD,uHole));
    c += DL*(cl-c)+DR*(cr-c)+DU*(cu-c)+DD*(cd-c);
    if(p.y<0.13){ float k=smoothstep(0.13,0.03,p.y); c+=k*uLeak*max(vec2(0.0),uBlood-c); }
    if(p.y>0.86){ c*=0.85; }
    outColor=vec4(clamp(c,0.0,1.4),0.0,1.0); }`;

  const COPY=`#version 300 es
  precision highp float; precision highp sampler2D;
  in vec2 vUv; out vec4 o; uniform sampler2D uField; void main(){ o=vec4(texture(uField,vUv).rg,0.0,1.0); }`;
  const BLUR=`#version 300 es
  precision highp float; precision highp sampler2D;
  in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uDir;
  void main(){ vec2 c=texture(uTex,vUv).rg*0.2270;
    c+=texture(uTex,vUv+uDir*1.3846).rg*0.3162; c+=texture(uTex,vUv-uDir*1.3846).rg*0.3162;
    c+=texture(uTex,vUv+uDir*3.2308).rg*0.0703; c+=texture(uTex,vUv-uDir*3.2308).rg*0.0703; o=vec4(c,0.0,1.0); }`;

  const DISP=`#version 300 es
  precision highp float; precision highp sampler2D;
  in vec2 vUv; out vec4 outColor; uniform sampler2D uField,uBloom;
  uniform float uTime,uDebug,uBloomK,uWarp,uTone; uniform vec2 uShow; uniform vec3 uColG,uColU,uColGHot,uColUHot,uColBoth;
  ${FIELDS}
  vec3 ramp(vec3 base,vec3 hot,float t){ t=clamp(t,0.0,1.0);
    vec3 dark=base*0.12, mid=base;
    vec3 col=mix(dark,mid,smoothstep(0.0,0.5,t)); return mix(col,hot,smoothstep(0.5,1.0,t)); }
  vec3 tonemap(vec3 col,float tone){ float luma=dot(col,vec3(0.299,0.587,0.114));
    float tm=1.0-exp(-luma*tone); return col*(tm/max(luma,1e-4)); }
  vec3 combine(vec2 t,vec3 colG,vec3 colU){
    vec3 g=ramp(colG,uColGHot,t.x)*smoothstep(0.0,0.06,t.x);
    vec3 u=ramp(colU,uColUHot,t.y)*smoothstep(0.0,0.06,t.y);
    vec3 add=g+u; float addLum=dot(add,vec3(0.299,0.587,0.114));
    float ov=smoothstep(0.04,0.22,min(t.x,t.y));
    return mix(add, uColBoth*addLum, ov);
  }
  void main(){ vec2 p=vUv;
    if(uDebug>0.5){ vec2 rw=texture(uField,p).rg; float v=(uDebug<1.5)?rw.r:rw.g; outColor=vec4(vec3(clamp(v,0.0,1.4)/1.4),1.0); return; }
    vec2 q=vec2(fbm(p*5.0+uTime*0.10), fbm(p*5.0+vec2(5.2,1.3)-uTime*0.08));
    vec2 sp=p+(q-0.5)*uWarp; sp.x=fract(sp.x);
    vec2 c=texture(uField,sp).rg*uShow; vec2 bl=texture(uBloom,sp).rg*uShow;
    vec3 col = combine(c,uColG,uColU) + combine(bl,uColG,uColU)*uBloomK;
    col = tonemap(col,uTone);
    float ves=smoothstep(0.155,0.07,p.y); col=mix(col,col*0.6+vec3(0.30,0.03,0.05),ves*0.78);
    float vig=smoothstep(1.28,0.32,length((vUv-0.5)*vec2(1.0,1.08))); col*=0.52+0.48*vig;
    col+=(hash(vUv*uTime)-0.5)*0.016;
    outColor=vec4(col,1.0); }`;

  const PVERT=`#version 300 es
  in vec2 aP; uniform float uPx; void main(){gl_Position=vec4(aP*2.0-1.0,0.0,1.0);gl_PointSize=uPx;}`;
  const PFRAG=`#version 300 es
  precision highp float; out vec4 o;
  void main(){ float a=smoothstep(0.5,0.0,length(gl_PointCoord-0.5)); o=vec4(vec3(1.0,0.74,0.66)*a,a); }`;

  // point-sample the field at an arbitrary uv (aptamer root position), byte-encoded so
  // a single readPixels() per frame can pull every aptamer's local concentration at once.
